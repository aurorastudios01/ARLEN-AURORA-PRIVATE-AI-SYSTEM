name: Build ARLEN NEXUS v0.5 Single EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ARLEN_NEXUS_ONEFILE.spec"
      - ".github/workflows/windows-onefile-v05.yml"

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pyinstaller -r requirements.txt

      - name: Compile source
        run: python -m py_compile main.py backend.py tests/test_core.py

      - name: Run core tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Lint QML
        shell: pwsh
        run: |
          $qmlLint = Get-ChildItem -Path "$env:pythonLocation" -Recurse -Filter qmllint.exe | Select-Object -First 1
          if (-not $qmlLint) { throw "qmllint.exe was not found" }
          & $qmlLint.FullName qml/Main.qml
          if ($LASTEXITCODE -ne 0) { throw "QML lint failed" }

      - name: Build single EXE
        run: python -m PyInstaller --noconfirm --clean ARLEN_NEXUS_ONEFILE.spec

      - name: Verify single EXE
        shell: pwsh
        run: |
          $exe = "dist/ARLEN-NEXUS-v0.5.exe"
          if (-not (Test-Path $exe)) { throw "ARLEN-NEXUS-v0.5.exe was not produced" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "ARLEN-NEXUS-v0.5.exe SHA-256: $hash" | Set-Content "ARLEN-NEXUS-v0.5-SHA256.txt"
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Windows single-EXE launch test
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/ARLEN-NEXUS-v0.5.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 30
          if ($process.HasExited) { throw "ARLEN exited during launch test (code $($process.ExitCode))" }
          Stop-Process -Id $process.Id -Force
          "Windows single-EXE launch smoke test: PASS (30 seconds)" | Add-Content "ARLEN-NEXUS-v0.5-SHA256.txt"

      - name: Publish direct EXE release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist/ARLEN-NEXUS-v0.5.exe"
          gh release view v0.5 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.5 $asset "ARLEN-NEXUS-v0.5-SHA256.txt" --clobber
          } else {
            gh release create v0.5 $asset "ARLEN-NEXUS-v0.5-SHA256.txt" --target "$env:GITHUB_SHA" --title "ARLEN NEXUS v0.5 — Single EXE" --notes-file "RELEASE-NOTES-v0.5.md"
          }

      - name: Preserve build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARLEN-NEXUS-v0.5-Single-EXE
          path: |
            dist/ARLEN-NEXUS-v0.5.exe
            ARLEN-NEXUS-v0.5-SHA256.txt
          if-no-files-found: error
          retention-days: 30
