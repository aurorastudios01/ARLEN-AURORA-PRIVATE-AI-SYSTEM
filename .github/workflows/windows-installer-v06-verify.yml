name: Verify ARLEN NEXUS v0.6 Installer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-installer:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pytest pyinstaller -r requirements.txt
      - run: python -m py_compile main.py backend.py tests/test_core.py
      - name: Core tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: QML lint
        shell: pwsh
        run: |
          $qmlLint = Get-ChildItem -Path "$env:pythonLocation" -Recurse -Filter qmllint.exe | Select-Object -First 1
          if (-not $qmlLint) { throw "qmllint.exe was not found" }
          & $qmlLint.FullName qml/Main.qml
          if ($LASTEXITCODE -ne 0) { throw "QML lint failed" }
      - run: python -m PyInstaller --noconfirm --clean ARLEN_NEXUS.spec
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Recurse -Filter ISCC.exe | Select-Object -First 1
          }
          & $iscc.FullName "installer/ARLEN-NEXUS.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Install and visual test
        shell: pwsh
        run: |
          $setup = Resolve-Path "installer-output/ARLEN-NEXUS-Setup-v0.6.exe"
          $testInstall = Join-Path $env:RUNNER_TEMP "ARLEN-NEXUS-v06"
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$testInstall"
          if ($LASTEXITCODE -ne 0) { throw "Silent installer failed with code $LASTEXITCODE" }
          $installed = Join-Path $testInstall "ARLEN NEXUS.exe"
          if (-not (Test-Path $installed)) {
            Get-ChildItem $testInstall -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            throw "Installed EXE missing at $installed"
          }
          $env:QT_SCALE_FACTOR = "1"
          $process = Start-Process -FilePath $installed -WorkingDirectory $testInstall -PassThru
          Start-Sleep -Seconds 22
          if ($process.HasExited) { throw "Installed app exited with code $($process.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$PWD\installer-output\visual-verification.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ARLEN-v0.6-Visual-Verification
          path: installer-output/visual-verification.png
          retention-days: 7
