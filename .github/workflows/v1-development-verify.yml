name: Verify ARLEN NEXUS V1 Development

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-source:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core build dependencies
        run: python -m pip install --upgrade pip pytest pyinstaller -r requirements.txt

      - name: Compile source and tests
        run: python -m py_compile main.py backend.py v1_services.py tests/test_core.py tests/test_v1_services.py

      - name: Run core tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Lint QML
        shell: pwsh
        run: |
          $qmlLint = Get-ChildItem -Path "$env:pythonLocation" -Recurse -Filter qmllint.exe | Select-Object -First 1
          if (-not $qmlLint) { throw "qmllint.exe was not found" }
          & $qmlLint.FullName qml/Main.qml
          if ($LASTEXITCODE -ne 0) { throw "QML lint failed" }

      - name: Render responsive UI checkpoints
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force -Path ui-verification | Out-Null
          python main.py --capture-ui ui-verification/aurora-1366x768.png 1366 768
          if ($LASTEXITCODE -ne 0) { throw "1366x768 UI capture failed" }
          python main.py --capture-ui ui-verification/aurora-1920x1080.png 1920 1080
          if ($LASTEXITCODE -ne 0) { throw "1920x1080 UI capture failed" }

      - name: Render every functional workspace at laptop size
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force -Path ui-pages | Out-Null
          $pages = @{
            "calculator" = 15; "converter" = 16; "pdf" = 12;
            "image" = 10; "files" = 5; "notes" = 17;
            "screenshot" = 18; "clipboard" = 19;
            "system-info" = 14; "settings" = 9;
            "theme" = 13; "automation" = 6
          }
          foreach ($name in $pages.Keys) {
            python main.py --capture-ui "ui-pages/$name-1366x768.png" 1366 768 --capture-page $pages[$name]
            if ($LASTEXITCODE -ne 0) { throw "$name responsive capture failed" }
          }

      - name: Emit workspace preview fallback
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem ui-pages/*.png) {
            "ARLEN_PAGE_BEGIN:$($file.Name)"
            [Convert]::ToBase64String([IO.File]::ReadAllBytes($file.FullName))
            "ARLEN_PAGE_END:$($file.Name)"
          }

      - name: Emit responsive preview fallback
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem ui-verification/*.png) {
            "ARLEN_PREVIEW_BEGIN:$($file.Name)"
            [Convert]::ToBase64String([IO.File]::ReadAllBytes($file.FullName))
            "ARLEN_PREVIEW_END:$($file.Name)"
          }

      - name: Build development application folder
        run: python -m PyInstaller --noconfirm --clean ARLEN_NEXUS.spec

      - name: Confirm executable exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter "ARLEN NEXUS.exe" | Select-Object -First 1
          if (-not $exe) { throw "ARLEN NEXUS.exe was not produced" }
          "Verification-only build: $($exe.FullName)"

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter "ARLEN NEXUS.exe" | Select-Object -First 1
          $process = Start-Process $exe.FullName -ArgumentList "--capture-ui", "ui-verification/packaged-1366x768.png", "1366", "768" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path "ui-verification/packaged-1366x768.png")) { throw "Packaged application launch test failed with exit code $($process.ExitCode)" }

      - name: Build V1.1 Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Recurse -Filter ISCC.exe | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          & $iscc.FullName installer/ARLEN-NEXUS.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Silent-install and launch-test V1.1
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer-output -Filter "ARLEN-NEXUS-Setup-v1.1.0.exe" | Select-Object -First 1
          if (-not $setup) { throw "V1.1 installer was not produced" }
          $installRoot = Join-Path $env:RUNNER_TEMP "ARLEN NEXUS V1.1 Installed"
          $process = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installRoot`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installation failed" }
          $installedExe = Join-Path $installRoot "ARLEN NEXUS.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed executable was not found" }
          $launch = Start-Process $installedExe -ArgumentList "--capture-ui", "ui-verification/installed-1366x768.png", "1366", "768" -Wait -PassThru
          if ($launch.ExitCode -ne 0 -or -not (Test-Path "ui-verification/installed-1366x768.png")) { throw "Installed application launch test failed with exit code $($launch.ExitCode)" }

      - name: Publish verified V1.1 first release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.1.0"
          $setup = "installer-output/ARLEN-NEXUS-Setup-v1.1.0.exe"
          if (-not (Test-Path $setup)) { throw "Verified V1.1 installer is missing" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite it automatically" }
          gh release create $tag "$setup#ARLEN NEXUS Setup v1.1.0" `
            --target "$env:GITHUB_SHA" `
            --title "ARLEN NEXUS V1.1 — First Release" `
            --notes "First stable ARLEN NEXUS release. Includes the responsive Aurora interface, Theme Studio with removable custom core/background, local chat and tools, installer verification, and low-resource defaults."

      - name: Upload internal verification bundle
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ARLEN-NEXUS-V1-Development-Verification
          path: dist/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload responsive UI screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ARLEN-NEXUS-V1.1-Responsive-UI
          path: ui-verification/*.png
          if-no-files-found: error
          retention-days: 14

# This workflow verifies the source, packaged EXE and installer. Publishing and
# removal of an older release are separate owner-confirmed actions.
