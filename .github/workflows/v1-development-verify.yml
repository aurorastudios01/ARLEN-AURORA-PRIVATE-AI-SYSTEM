name: Verify ARLEN NEXUS V1 Development

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core build dependencies
        run: python -m pip install --upgrade pip pytest pyinstaller -r requirements.txt

      - name: Compile source and tests
        run: python -m py_compile main.py backend.py v1_services.py tests/test_core.py tests/test_v1_services.py

      - name: Run core tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Lint QML
        shell: pwsh
        run: |
          $qmlLint = Get-ChildItem -Path "$env:pythonLocation" -Recurse -Filter qmllint.exe | Select-Object -First 1
          if (-not $qmlLint) { throw "qmllint.exe was not found" }
          & $qmlLint.FullName qml/Main.qml
          if ($LASTEXITCODE -ne 0) { throw "QML lint failed" }

      - name: Render responsive UI checkpoints
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Force -Path ui-verification | Out-Null
          python main.py --capture-ui ui-verification/aurora-1366x768.png 1366 768
          if ($LASTEXITCODE -ne 0) { throw "1366x768 UI capture failed" }
          python main.py --capture-ui ui-verification/aurora-1920x1080.png 1920 1080
          if ($LASTEXITCODE -ne 0) { throw "1920x1080 UI capture failed" }

      - name: Emit responsive preview fallback
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem ui-verification/*.png) {
            "ARLEN_PREVIEW_BEGIN:$($file.Name)"
            [Convert]::ToBase64String([IO.File]::ReadAllBytes($file.FullName))
            "ARLEN_PREVIEW_END:$($file.Name)"
          }

      - name: Build development application folder
        run: python -m PyInstaller --noconfirm --clean ARLEN_NEXUS.spec

      - name: Confirm executable exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter "ARLEN NEXUS.exe" | Select-Object -First 1
          if (-not $exe) { throw "ARLEN NEXUS.exe was not produced" }
          "Verification-only build: $($exe.FullName)"

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter "ARLEN NEXUS.exe" | Select-Object -First 1
          & $exe.FullName --capture-ui ui-verification/packaged-1366x768.png 1366 768
          if ($LASTEXITCODE -ne 0) { throw "Packaged application launch test failed" }

      - name: Build V1.1 Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Recurse -Filter ISCC.exe | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          & $iscc.FullName installer/ARLEN-NEXUS.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Silent-install and launch-test V1.1
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer-output -Filter "ARLEN-NEXUS-Setup-v1.1.0.exe" | Select-Object -First 1
          if (-not $setup) { throw "V1.1 installer was not produced" }
          $installRoot = Join-Path $env:RUNNER_TEMP "ARLEN NEXUS V1.1 Installed"
          $process = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installRoot`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installation failed" }
          $installedExe = Join-Path $installRoot "ARLEN NEXUS.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed executable was not found" }
          & $installedExe --capture-ui ui-verification/installed-1366x768.png 1366 768
          if ($LASTEXITCODE -ne 0) { throw "Installed application launch test failed" }

      - name: Upload internal verification bundle
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ARLEN-NEXUS-V1-Development-Verification
          path: dist/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload responsive UI screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ARLEN-NEXUS-V1.1-Responsive-UI
          path: ui-verification/*.png
          if-no-files-found: error
          retention-days: 14

# This workflow verifies the source, packaged EXE and installer. Publishing and
# removal of an older release are separate owner-confirmed actions.
