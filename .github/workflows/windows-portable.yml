name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pytest pyinstaller -r requirements.txt

      - name: Compile Python source
        run: python -m py_compile main.py backend.py tests/test_core.py

      - name: Run core tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Lint QML
        shell: pwsh
        run: |
          $qmlLint = Get-ChildItem -Path "$env:pythonLocation" -Recurse -Filter qmllint.exe | Select-Object -First 1
          if (-not $qmlLint) { throw "qmllint.exe was not found" }
          & $qmlLint.FullName qml/Main.qml
          if ($LASTEXITCODE -ne 0) { throw "QML lint failed" }

      - name: Build portable folder
        run: python -m PyInstaller --noconfirm --clean ARLEN_NEXUS.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/ARLEN NEXUS Portable/ARLEN NEXUS.exe"
          if (-not (Test-Path $exe)) { throw "ARLEN NEXUS.exe was not produced" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "ARLEN NEXUS.exe SHA-256: $hash" | Set-Content "dist/ARLEN NEXUS Portable/BUILD-VERIFICATION.txt"
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Windows launch smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/ARLEN NEXUS Portable/ARLEN NEXUS.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) { throw "ARLEN exited during the Windows launch smoke test (code $($process.ExitCode))" }
          Stop-Process -Id $process.Id -Force
          "Windows launch smoke test: PASS (15 seconds)" | Add-Content "dist/ARLEN NEXUS Portable/BUILD-VERIFICATION.txt"

      - name: Add release documents
        shell: pwsh
        run: |
          Copy-Item PORTABLE_RELEASE_CHECKLIST.md "dist/ARLEN NEXUS Portable/"
          Copy-Item README.md "dist/ARLEN NEXUS Portable/README.md"

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/ARLEN NEXUS Portable/*" -DestinationPath "ARLEN-NEXUS-Portable-v0.4-ci.zip" -CompressionLevel Optimal

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARLEN-NEXUS-Portable-v0.4-Windows
          path: ARLEN-NEXUS-Portable-v0.4-ci.zip
          if-no-files-found: error
          retention-days: 30
