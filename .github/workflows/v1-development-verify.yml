name: Verify ARLEN NEXUS V1 Development

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core build dependencies
        run: python -m pip install --upgrade pip pytest pyinstaller -r requirements.txt

      - name: Compile source and tests
        run: python -m py_compile main.py backend.py tests/test_core.py

      - name: Run core tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Lint QML
        shell: pwsh
        run: |
          $qmlLint = Get-ChildItem -Path "$env:pythonLocation" -Recurse -Filter qmllint.exe | Select-Object -First 1
          if (-not $qmlLint) { throw "qmllint.exe was not found" }
          & $qmlLint.FullName qml/Main.qml
          if ($LASTEXITCODE -ne 0) { throw "QML lint failed" }

      - name: Build development application folder
        run: python -m PyInstaller --noconfirm --clean ARLEN_NEXUS.spec

      - name: Confirm executable exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Recurse -Filter "ARLEN NEXUS.exe" | Select-Object -First 1
          if (-not $exe) { throw "ARLEN NEXUS.exe was not produced" }
          "Verification-only build: $($exe.FullName)"

      - name: Upload internal verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: ARLEN-NEXUS-V1-Development-Verification
          path: dist/**
          if-no-files-found: error
          retention-days: 7

# This workflow intentionally does not create or modify a GitHub Release.
# v0.7 remains untouched until a fully verified V1.x publishing workflow replaces it.

