name: Build ARLEN NEXUS v0.7 Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "qml/**"
      - "backend.py"
      - "main.py"
      - "ARLEN_NEXUS.spec"
      - "installer/**"
      - ".github/workflows/windows-installer-v06.yml"

permissions:
  contents: write

jobs:
  build-test-install:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pyinstaller -r requirements.txt

      - name: Compile source
        run: python -m py_compile main.py backend.py tests/test_core.py

      - name: Run core tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Lint QML
        shell: pwsh
        run: |
          $qmlLint = Get-ChildItem -Path "$env:pythonLocation" -Recurse -Filter qmllint.exe | Select-Object -First 1
          if (-not $qmlLint) { throw "qmllint.exe was not found" }
          & $qmlLint.FullName qml/Main.qml
          if ($LASTEXITCODE -ne 0) { throw "QML lint failed" }

      - name: Build Windows application folder
        run: python -m PyInstaller --noconfirm --clean ARLEN_NEXUS.spec

      - name: Build Setup EXE
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*" -Recurse -Filter ISCC.exe | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          & $iscc.FullName "installer/ARLEN-NEXUS.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Install silently for validation
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer-output/ARLEN-NEXUS-Setup-v0.7.exe").Path
          $testInstall = Join-Path $env:RUNNER_TEMP "ARLEN-NEXUS-v07-release"
          $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$testInstall", "/LOG=$PWD\installer-output\install.log")
          $installProcess = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Silent install failed with code $($installProcess.ExitCode)" }
          $installed = Join-Path $testInstall "ARLEN NEXUS.exe"
          if (-not (Test-Path $installed)) { throw "Installed ARLEN NEXUS.exe was not found at $installed" }

      - name: Launch installed application and capture screenshot
        shell: pwsh
        run: |
          $env:QT_SCALE_FACTOR = "1"
          $testInstall = Join-Path $env:RUNNER_TEMP "ARLEN-NEXUS-v07-release"
          $installed = Join-Path $testInstall "ARLEN NEXUS.exe"
          $visualData = Join-Path $env:LOCALAPPDATA "ARLEN NEXUS\UserData"
          New-Item -ItemType Directory -Force -Path $visualData | Out-Null
          '{"first_run":false,"pin_hash":"visual-test","opening_duration":3,"opening_sound":false}' | Set-Content (Join-Path $visualData "settings.json") -Encoding UTF8
          $process = Start-Process -FilePath $installed -WorkingDirectory $testInstall -PassThru
          Start-Sleep -Seconds 22
          if ($process.HasExited) { throw "Installed ARLEN exited during launch test (code $($process.ExitCode))" }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$PWD\installer-output\ARLEN-NEXUS-v0.7-installed.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bitmap.Dispose()
          Stop-Process -Id $process.Id -Force

      - name: Record hashes
        shell: pwsh
        run: |
          $setup = "installer-output/ARLEN-NEXUS-Setup-v0.7.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          "ARLEN-NEXUS-Setup-v0.7.exe SHA-256: $hash" | Set-Content "installer-output/ARLEN-NEXUS-v0.7-SHA256.txt"
          "Windows installed-app launch and screenshot test: PASS" | Add-Content "installer-output/ARLEN-NEXUS-v0.7-SHA256.txt"

      - name: Publish installer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "installer-output/ARLEN-NEXUS-Setup-v0.7.exe"
          $shot = "installer-output/ARLEN-NEXUS-v0.7-installed.png"
          $hash = "installer-output/ARLEN-NEXUS-v0.7-SHA256.txt"
          gh release view v0.7 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.7 $setup $shot $hash --clobber
          } else {
            gh release create v0.7 $setup $shot $hash --target "$env:GITHUB_SHA" --title "ARLEN NEXUS v0.7 — Interface Evolution" --notes "Proper per-user Windows installer with redesigned cinematic boot screen, responsive command center, shortcuts, uninstall support, preserved owner data, automated tests and installed-app screenshot verification."
          }

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARLEN-NEXUS-v0.7-Installer-Verification
          path: |
            installer-output/ARLEN-NEXUS-Setup-v0.7.exe
            installer-output/ARLEN-NEXUS-v0.7-installed.png
            installer-output/ARLEN-NEXUS-v0.7-SHA256.txt
            installer-output/install.log
          if-no-files-found: error
          retention-days: 30
